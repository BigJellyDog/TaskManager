name: Build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the MAUI workload
        run: dotnet workload install maui

      - name: Build
        run: dotnet build TaskManager.sln -c Release

      - name: Test
        run: dotnet test TaskManager.Tests/TaskManager.Tests.csproj -c Release --no-build
